<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Techfest Game - Four Keeps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- HOME SCREEN -->
<div id="screen-home" class="screen active">
  <div class="panel home-panel">
    <h1>Techfest <span class="lite">Game</span></h1>
    <input id="nickname-input" maxlength="16" placeholder="Enter roll no" autocomplete="username" />
    <input id="pin-input" maxlength="4" placeholder="4-digit PIN" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" />
    <p class="hint" style="margin:4px 0 0;font-size:12px">New name? Choose a PIN. Returning? Enter your PIN.</p>

    <div class="home-actions">
      <button id="btn-create" class="btn btn-primary">Create Lobby</button>
      <div class="join-row">
        <input id="code-input" maxlength="5" placeholder="LOBBY CODE" style="text-transform:uppercase" />
        <button id="btn-join" class="btn btn-secondary">Join</button>
      </div>
    </div>

    <div class="leaderboard-box">
      <h3>Global Leaderboard</h3>
      <div id="leaderboard-list" class="leaderboard-list"><em>Loading...</em></div>
    </div>

    <div id="home-error" class="error-msg"></div>
  </div>
</div>

<!-- LOBBY SCREEN -->
<div id="screen-lobby" class="screen">
  <div class="panel lobby-panel">
    <h2>Lobby Code: <span id="lobby-code-display"></span></h2>
    <p class="hint">Share this code with friends so they can join (Max 4).</p>
    <div id="lobby-players" class="lobby-players"></div>
    <div class="lobby-actions">
      <button id="btn-ready" class="btn btn-secondary">Ready</button>
      <button id="btn-start" class="btn btn-primary" style="display:none">Start Game</button>
    </div>
    <button id="btn-leave" class="btn btn-danger" style="width:100%;margin-top:10px">Leave Lobby</button>
    <div id="lobby-error" class="error-msg"></div>
  </div>
</div>

<!-- GAME SCREEN -->
<div id="screen-game" class="screen">
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
  </div>
</div>

<!-- GAME OVER MODAL -->
<div id="modal-gameover" class="modal-overlay">
  <div class="modal-box">
    <h2 id="gameover-title">Game Over</h2>
    <div id="gameover-scores"></div>
    <button id="btn-back-home" class="btn btn-primary" style="margin-top: 15px;">Back to Home</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
